# amp model configs: named presets with a quality dial.
#
#   --model-config <name>:v<N>        apply variant N of preset <name>
#   --model-config <name>             list the variants of <name> and exit
#   AMP_MODEL_CONFIGS=<path>          use a different file (default: configs/model-configs.conf,
#                                     resolved next to this file's owner, then the cwd)
#
# A preset is EXACTLY equivalent to having typed its flags. It sets the same fields and marks them
# as user-supplied, so the planner will not override them. That is deliberate: it means the
# precedence is the obvious one and there is no second code path to reason about.
#
#     --model-config occamy:v2 -ctv f16     -> f16 wins, the preset fills in everything else
#     --model-config occamy:v3              -> the preset is the whole configuration
#
# An explicit flag always beats the preset. The planner's own defaults apply only where neither
# says anything.
#
# Format is deliberately trivial - "key = value" under a "[name:vN]" header - so that no JSON or
# INI parser is needed in the preflight, which is the one piece of amp that has to stay small and
# dependency-free. An unknown key is a hard error rather than a silent no-op, because a typo in a
# config file that quietly does nothing is the worst possible failure mode for a quality dial.
#
# Keys a variant may set. Only these; each is applied as if the matching flag had been passed.
#
#   cache_type_k, cache_type_v   KV cache dtypes, e.g. q8_0, q4_0, f16
#   n_ctx                        total context, shared across slots
#   cache_ram_mib                llama.cpp's RAM prompt cache in MiB; 0 disables it
#   n_parallel                   number of concurrent slots
#   n_ubatch                     physical batch size for prefill
#   n_threads                    generation threads
#   temperature                  sampling temperature; llama-server default 0.80
#   top_p, top_k, min_p          nucleus, top-k and min-p cutoffs
#   repetition_penalty           penalty on the last 64 tokens; 1.0 disables it
#   presence_penalty             penalty on tokens already present; 0.0 disables it
#   enable_thinking              on, off or auto. A chat-template variable, not a sampler: it
#                                decides whether the template asks for a reasoning block
#
# The two axes are independent and any variant may set keys from both. ":vN" is the KV quality
# dial and ":sN" a sampler profile, and there is nothing stopping a [name:v2] block from also
# carrying a temperature. The suffix letter is not interpreted: whatever a header says is what
# --model-config looks for, so a new axis needs no code change here. A bare number, as in
# "--model-config occamy:2", still means the v axis.
#
# The samplers are llama-server's request defaults, not a hard override. A request that carries
# its own temperature still wins for that request, which is why this file is the place to pin
# them rather than a client config.
#
# `n_ctx` is the TOTAL across slots, matching llama.cpp. So with n_parallel 2 and n_ctx 200000 a
# single conversation gets 100096 tokens, and n_ctx 400000 gives 200192 per conversation. This is
# llama.cpp's own semantics and is deliberately not "corrected" here, because a flag that means
# something different from the flag of the same name upstream is a trap.

[occamy-1.0-apex-i-miniplus]
description = Occamy 1.0 APEX-I MiniPlus V2.1 (Abliterated), hybrid qwen35moe, 40 layers of which 10 carry KV

[occamy-1.0-apex-i-miniplus:v1]
label        = quality 1, smallest KV. q4_0 V is about 8x further from f16 than q8_0 V.
cache_type_k = q8_0
cache_type_v = q4_0

[occamy-1.0-apex-i-miniplus:v2]
label        = quality 2, the default. 8.8x closer to f16 than v1, measured.
cache_type_k = q8_0
cache_type_v = q8_0

[occamy-1.0-apex-i-miniplus:v3]
label        = quality 3, f16 KV - llama.cpp's own default and the most precise available.
              # n_ctx is cut to 131072 because f16 KV does NOT fit at 200k on this box: it fails
              # to allocate the prefill compute buffers even with 0 GPU expert layers. 131072 is
              # the largest size measured to start. The planner still chooses the GPU expert layer
              # count from whatever VRAM is left.
cache_type_k = f16
cache_type_v = f16
n_ctx        = 131072

# -- Sampler profiles. A second axis, independent of the KV quality dial above: an ":sN" profile
#    sets only samplers, and the KV side falls to the planner, which already defaults to the v2
#    dtypes. A "[name:vN]" block may still carry sampler keys if you want both pinned at once.
#
#    These are the four rows of the model's published sampler table, transcribed. The two rows
#    that give temperature as a range take the low end, and the high end is one flag away:
#
#        --model-config occamy-1.0-apex-i-miniplus:s2 --temp 0.35
#
#    An explicit flag beats the profile, which is what makes the ranges testable without a preset
#    per endpoint.
[occamy-1.0-apex-i-miniplus:s1]
label              = co-work, agentic and tool use. The official Accio-Lab recommendation for
                    # multi-turn co-work and tool execution. The high temperature is the point:
                    # it is the row that trades strictness for variety, so it is the one to measure
                    # against row 2 rather than assume is worse.
temperature        = 1.00
top_p              = 0.95
top_k              = 20
presence_penalty   = 1.5
enable_thinking    = true

# The author's own usage example, transcribed from the Accio-Lab/occamy-1.0 model card rather than
# from the quant's card. The four sampler values are byte-identical to :s1, so this is :s1 plus
# the two things :s1 does not cover. It exists because the card is the primary source and someone
# reading it should find a preset that matches it exactly, not have to diff it against :s1.
#
# What :s1 does not carry:
#
#   max_tokens 32768. A request default, not a sampler, so it rides in on extra_args as -n. A client
#               that sends its own max_tokens still wins for that request.
#
#   preserve_thinking. The card sets it True, and llama.cpp already defaults it on
#               (common/arg.cpp:958-960, which sets preserve_reasoning to "true" when unspecified).
#               So it is deliberately NOT repeated here. Writing it would be noise, and the two
#               names are not the same variable: the flag sets preserve_reasoning, which
#               caps_apply_preserve_reasoning then maps to preserve_thinking
#               (jinja/caps.cpp:22-27). Repeating it would also put this preset on the wrong side
#               of a future upstream default change.
[occamy-1.0-apex-i-miniplus:reasoning]
label              = the Accio-Lab card's own example: co-work reasoning with a long answer
                     # budget. Same samplers as :s1, plus max_tokens 32768.
temperature        = 0.25
top_p              = 0.95
top_k              = 20
min_p              = 0.05
repetition_penalty = 1.0
enable_thinking    = true
extra_args         = -n 32768
cache_type_k = q8_0
cache_type_v = q8_0

[occamy-1.0-apex-i-miniplus:s2]
label              = deterministic coding and scripting. Strict deterministic syntax, code
                    # completion, and no token repetition in an automated agent loop. Temperature
                    # is a 0.20-0.35 range in the source table; the low end is taken because that
                    # is the row's own stated purpose.
temperature        = 0.20
top_p              = 0.95
top_k              = 20
min_p              = 0.05
repetition_penalty = 1.05
cache_type_k = q8_0
cache_type_v = q8_0

[occamy-1.0-apex-i-miniplus:s3]
label              = independent SWE-bench baseline. The fixed comparative setting zephel01
                    # used across 348 unseeded llmbench trials at 90.0-93.3% resolution, so this
                    # is the row to use when the number has to be comparable to a published
                    # score. min_p and repetition_penalty are set to their disabled values on
                    # purpose; that is what makes it a baseline rather than a tuned profile.
temperature        = 0.35
top_p              = 0.95
top_k              = 20
min_p              = 0.0
repetition_penalty = 1.0

[occamy-1.0-apex-i-miniplus:s4]
label              = general multilingual instruction. Balanced creativity and factual accuracy
                    # across 13+ languages. Temperature is a 0.60-0.70 range; low end taken.
temperature        = 0.60
top_p              = 0.95
top_k              = 20
repetition_penalty = 1.08
cache_type_k = q8_0
cache_type_v = q8_0
