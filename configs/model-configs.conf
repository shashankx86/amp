# amp model configs: named presets with a quality dial.
#
#   --model-config <name>:v<N>        apply variant N of preset <name>
#   --model-config <name>             list the variants of <name> and exit
#   AMP_MODEL_CONFIGS=<path>          use a different file (default: configs/model-configs.conf,
#                                     resolved next to this file's owner, then the cwd)
#
# A preset is EXACTLY equivalent to having typed its flags. It sets the same fields and marks them
# as user-supplied, so the planner will not override them. That is deliberate: it means the
# precedence is the obvious one and there is no second code path to reason about.
#
#     --model-config occamy:v2 -ctv f16     -> f16 wins, the preset fills in everything else
#     --model-config occamy:v3              -> the preset is the whole configuration
#
# An explicit flag always beats the preset. The planner's own defaults apply only where neither
# says anything.
#
# Format is deliberately trivial - "key = value" under a "[name:vN]" header - so that no JSON or
# INI parser is needed in the preflight, which is the one piece of amp that has to stay small and
# dependency-free. An unknown key is a hard error rather than a silent no-op, because a typo in a
# config file that quietly does nothing is the worst possible failure mode for a quality dial.
#
# Keys a variant may set. Only these; each is applied as if the matching flag had been passed.
#
#   cache_type_k, cache_type_v   KV cache dtypes, e.g. q8_0, q4_0, f16
#   n_ctx                        total context, shared across slots
#   cache_ram_mib                llama.cpp's RAM prompt cache in MiB; 0 disables it
#   n_parallel                   number of concurrent slots
#   n_ubatch                     physical batch size for prefill
#   n_threads                    generation threads
#
# `n_ctx` is the TOTAL across slots, matching llama.cpp. So with n_parallel 2 and n_ctx 200000 a
# single conversation gets 100096 tokens, and n_ctx 400000 gives 200192 per conversation. This is
# llama.cpp's own semantics and is deliberately not "corrected" here, because a flag that means
# something different from the flag of the same name upstream is a trap.

[occamy-1.0-apex-i-miniplus]
description = Occamy 1.0 APEX-I MiniPlus V2.1 (Abliterated), hybrid qwen35moe, 40 layers of which 10 carry KV

[occamy-1.0-apex-i-miniplus:v1]
label        = quality 1, smallest KV. q4_0 V is about 8x further from f16 than q8_0 V.
cache_type_k = q8_0
cache_type_v = q4_0

[occamy-1.0-apex-i-miniplus:v2]
label        = quality 2, the default. 8.8x closer to f16 than v1, measured.
cache_type_k = q8_0
cache_type_v = q8_0

[occamy-1.0-apex-i-miniplus:v3]
label        = quality 3, f16 KV - llama.cpp's own default and the most precise available.
              # n_ctx is cut to 131072 because f16 KV does NOT fit at 200k on this box: it fails
              # to allocate the prefill compute buffers even with 0 GPU expert layers. 131072 is
              # the largest size measured to start. The planner still chooses the GPU expert layer
              # count from whatever VRAM is left.
cache_type_k = f16
cache_type_v = f16
n_ctx        = 131072
